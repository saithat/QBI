name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
        env:
          POSTGRES_DB: hiveblot_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HIVEBLOT_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/hiveblot_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Check code and database behavior
        run: make check
      - name: Build distribution
        run: uv build
      - name: Verify installed importer and frontend assets
        working-directory: ${{ runner.temp }}
        run: |
          uv run --no-project --isolated --with "$GITHUB_WORKSPACE"/dist/*.whl python - <<'PY'
          import re
          import sys
          from hiveblot.api import INDEX
          from hiveblot.pipeline import main

          assert INDEX.is_file()
          assets = re.findall(r'/assets/[^"\s]+', INDEX.read_text())
          assert assets
          assert all((INDEX.parent / asset.lstrip('/')).is_file() for asset in assets)
          sys.argv = ['hiveblot-ingest', '--help']
          main()
          PY

  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Run containerized tests
        run: make docker-test
