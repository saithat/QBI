services:
  postgres:
    image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiveblot}
      POSTGRES_USER: ${POSTGRES_USER:-hiveblot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run `make local-env` first}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hiveblot}:${POSTGRES_PASSWORD:?Run
        `make local-env` first}@postgres:5432/${POSTGRES_DB:-hiveblot}
      HIVEBLOT_DATA_DIR: /data
    volumes:
    - ./data:/data:ro
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health',
        timeout=5)
      interval: 10s
      timeout: 8s
      retries: 12
    restart: unless-stopped
  vllm:
    image: vllm/vllm-openai@sha256:4801151759655c57606c844662e5213403c032a62d149c7ce61d615759a821ef
    command:
    - Qwen/Qwen3-VL-8B-Instruct
    - --served-model-name
    - Qwen/Qwen3-VL-8B-Instruct
    - --max-model-len
    - '12288'
    - --gpu-memory-utilization
    - '0.90'
    - --max-num-seqs
    - '1'
    - --enforce-eager
    - --limit-mm-per-prompt
    - '{"image":1}'
    devices:
    - nvidia.com/gpu=all
    ipc: host
    environment:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    volumes:
    - ${HF_CACHE_DIR:-./data/huggingface-cache}:/root/.cache/huggingface:ro
    ports:
    - 127.0.0.1:8000:8000
    healthcheck:
      test:
      - CMD
      - /usr/bin/python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health',
        timeout=5)
      interval: 10s
      timeout: 8s
      retries: 24
      start_period: 90s
    restart: unless-stopped
    profiles:
    - gpu
volumes:
  postgres_data: null
