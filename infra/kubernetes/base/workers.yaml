apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiveblot-job-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hiveblot-job-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hiveblot-job-scheduler
        app.kubernetes.io/component: job-scheduler
        hiveblot.io/network-access: allow
    spec:
      serviceAccountName: hiveblot-job-scheduler
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: hiveblot:prd-014
          imagePullPolicy: IfNotPresent
          command: ["hiveblot-job-worker"]
          args: ["--executor", "kubernetes-job"]
          envFrom:
            - configMapRef:
                name: hiveblot-runtime
            - secretRef:
                name: hiveblot-runtime-secrets
          env:
            - name: JOB_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: hiveblot-job-scheduler
          startupProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspaces
              mountPath: /var/lib/hiveblot/jobs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: hiveblot-job-workspaces
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
