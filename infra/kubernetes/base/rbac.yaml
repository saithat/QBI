apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hiveblot-job-controller
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hiveblot-job-controllers
subjects:
  - kind: ServiceAccount
    name: hiveblot-job-scheduler
  - kind: ServiceAccount
    name: hiveblot-evaluation-worker
  - kind: ServiceAccount
    name: hiveblot-cpu-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hiveblot-job-controller
