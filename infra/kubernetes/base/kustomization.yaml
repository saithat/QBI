apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hiveblot
resources:
  - namespace.yaml
  - runtime-config.yaml
  - service-accounts.yaml
  - rbac.yaml
  - workspace.yaml
  - api.yaml
  - web.yaml
  - workers.yaml
  - discovery.yaml
  - otel-collector.yaml
  - network-policies.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: hiveblot
