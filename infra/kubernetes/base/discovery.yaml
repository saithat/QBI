apiVersion: batch/v1
kind: CronJob
metadata:
  name: hiveblot-pmc-discovery
spec:
  schedule: "17 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hiveblot-pmc-discovery
            app.kubernetes.io/component: discovery
            hiveblot.io/network-access: allow
        spec:
          serviceAccountName: hiveblot-discovery
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: discovery
              image: hiveblot:prd-015
              imagePullPolicy: IfNotPresent
              command: ["hiveblot-discover-pmc"]
              env:
                - name: HIVEBLOT_ENV
                  valueFrom:
                    configMapKeyRef:
                      name: hiveblot-runtime
                      key: HIVEBLOT_ENV
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: hiveblot-runtime-secrets
                      key: DATABASE_URL
                - name: S3_ENDPOINT_URL
                  valueFrom:
                    configMapKeyRef:
                      name: hiveblot-runtime
                      key: S3_ENDPOINT_URL
                - name: S3_REGION
                  valueFrom:
                    configMapKeyRef:
                      name: hiveblot-runtime
                      key: S3_REGION
                - name: S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: hiveblot-runtime
                      key: S3_BUCKET
                - name: S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: hiveblot-runtime-secrets
                      key: S3_ACCESS_KEY_ID
                - name: S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: hiveblot-runtime-secrets
                      key: S3_SECRET_ACCESS_KEY
                - name: ARTIFACT_MAX_BYTES
                  valueFrom:
                    configMapKeyRef:
                      name: hiveblot-runtime
                      key: ARTIFACT_MAX_BYTES
                - name: PMC_OAI_BASE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: hiveblot-runtime
                      key: PMC_OAI_BASE_URL
                - name: DISCOVERY_USER_AGENT
                  valueFrom:
                    configMapKeyRef:
                      name: hiveblot-runtime
                      key: DISCOVERY_USER_AGENT
                - name: DISCOVERY_HTTP_TIMEOUT_SECONDS
                  valueFrom:
                    configMapKeyRef:
                      name: hiveblot-runtime
                      key: DISCOVERY_HTTP_TIMEOUT_SECONDS
                - name: DISCOVERY_MAX_RESPONSE_BYTES
                  valueFrom:
                    configMapKeyRef:
                      name: hiveblot-runtime
                      key: DISCOVERY_MAX_RESPONSE_BYTES
                - name: DISCOVERY_LOOKBACK_DAYS
                  valueFrom:
                    configMapKeyRef:
                      name: hiveblot-runtime
                      key: DISCOVERY_LOOKBACK_DAYS
                - name: DISCOVERY_MAXIMUM_PAGES
                  valueFrom:
                    configMapKeyRef:
                      name: hiveblot-runtime
                      key: DISCOVERY_MAXIMUM_PAGES
                - name: OTEL_SERVICE_NAME
                  value: hiveblot-pmc-discovery
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
