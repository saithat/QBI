apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiveblot-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hiveblot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hiveblot-api
        app.kubernetes.io/component: api
        hiveblot.io/network-access: allow
    spec:
      serviceAccountName: hiveblot-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: hiveblot:prd-018
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["apps.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - configMapRef:
                name: hiveblot-runtime
            - secretRef:
                name: hiveblot-runtime-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: hiveblot-api
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hiveblot-api
spec:
  selector:
    app.kubernetes.io/name: hiveblot-api
  ports:
    - name: http
      port: 8080
      targetPort: http
